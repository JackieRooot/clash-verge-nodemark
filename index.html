<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>节点标记</title>
<style>
  /* Windows 自带字体不画国旗 emoji，只给国旗那段字符补一个字体（加载失败就退回成字母） */
  @font-face {
    font-family: "Twemoji Country Flags";
    unicode-range: U+1F1E6-1F1FF, U+1F3F4, U+E0062-E0063, U+E0065, U+E0067, U+E006C, U+E006E, U+E0073-E0074, U+E0077, U+E007F;
    src: url("https://cdn.jsdelivr.net/npm/country-flag-emoji-polyfill@0.1/dist/TwemojiCountryFlags.woff2") format("woff2");
    font-display: swap;
  }
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --card: #ffffff; --card-hover: #f0f3f8;
    --text: #1f2329; --muted: #6b7280; --line: #e3e6eb;
    --primary: #1976d2; --primary-bg: rgba(25, 118, 210, 0.12);
    --good: #16a34a; --good-bg: rgba(22, 163, 74, 0.15);
    --warn: #d97706; --warn-bg: rgba(217, 119, 6, 0.16);
    --bad: #dc2626; --bad-bg: rgba(220, 38, 38, 0.14);
    --star: #f59e0b; --star-off: #d5d9df;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181b; --panel: #1f2125; --card: #26292e; --card-hover: #2e3238;
      --text: #e6e8eb; --muted: #9aa1ab; --line: #34383f;
      --primary: #5aa9f5; --primary-bg: rgba(90, 169, 245, 0.16);
      --good: #34c46a; --good-bg: rgba(52, 196, 106, 0.18);
      --warn: #f0a530; --warn-bg: rgba(240, 165, 48, 0.18);
      --bad: #f2615b; --bad-bg: rgba(242, 97, 91, 0.18);
      --star: #fbbf24; --star-off: #4a4f57;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 "Twemoji Country Flags", -apple-system, "Segoe UI", "Microsoft YaHei UI", "PingFang SC", sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 10; background: var(--panel);
    border-bottom: 1px solid var(--line); padding: 10px 16px;
    display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  .chip {
    display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px;
    border-radius: 999px; background: var(--primary-bg); color: var(--primary); font-size: 12.5px;
  }
  .chip.err { background: var(--bad-bg); color: var(--bad); }
  .counts { display: flex; gap: 10px; font-size: 13px; color: var(--muted); }
  .counts b { font-weight: 600; }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-left: auto; }
  input[type=search], select {
    height: 30px; border: 1px solid var(--line); border-radius: 6px; padding: 0 8px;
    background: var(--card); color: var(--text); font: inherit; font-size: 13px;
  }
  input[type=search] { width: 180px; }
  label.toggle { display: inline-flex; gap: 4px; align-items: center; font-size: 13px; color: var(--muted); cursor: pointer; user-select: none; }
  /* 用户标记 / 系统标记 两种模式：只属于某个模式的控件在另一个模式下隐藏 */
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg button { border: 0; background: var(--card); color: var(--muted); font: inherit; font-size: 12.5px; height: 28px; padding: 0 10px; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on { background: var(--primary-bg); color: var(--primary); font-weight: 600; }
  body[data-mode=system] .user-only, body[data-mode=user] .system-only { display: none !important; }
  main { padding: 12px 16px 40px; max-width: 1800px; margin: 0 auto; }

  .group { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 10px; box-shadow: var(--shadow); }
  .ghead {
    display: flex; align-items: center; gap: 12px; padding: 10px 14px; cursor: pointer; user-select: none;
  }
  .ghead .gname { font-weight: 600; font-size: 15px; }
  .ghead .gsub { color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ghead .gtitle { min-width: 0; flex: 1; }
  .ghead .gmarks { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .ghead button, .btn {
    border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 6px;
    height: 28px; padding: 0 10px; font: inherit; font-size: 12.5px; cursor: pointer;
  }
  .ghead button:hover, .btn:hover { border-color: var(--primary); color: var(--primary); }
  .ghead button:disabled, .btn:disabled { opacity: .5; cursor: default; border-color: var(--line); color: var(--text); }
  .ghead .gbtns { display: flex; gap: 6px; }
  .chev { color: var(--muted); transition: transform .15s; }
  .group.open .chev { transform: rotate(90deg); }
  /* 组内节点分栏（宽屏 3 栏），每栏一行 2 个；节点先排满第一栏再排下一栏。
     每栏垫一层页面底色，靠色块分栏；各栏等高，最后一栏节点少时下面留空 */
  .grid { display: none; gap: 10px; padding: 0 14px 14px; }
  .group.open .grid { display: flex; }
  .ncol { flex: 1; min-width: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); align-content: start;
          gap: 8px; padding: 8px; background: var(--bg); border-radius: 8px; }

  .card {
    position: relative; background: var(--card); border: 1.5px solid var(--line); border-radius: 8px;
    padding: 8px 10px 7px; cursor: pointer; min-height: 58px; transition: background .1s;
  }
  .card:hover { background: var(--card-hover); }
  /* 只有选中的卡片画彩色框：1.5px 边框再加 1.5px 内描边，共 3px，不改变卡片尺寸 */
  .card.sel { background: var(--primary-bg); border-color: var(--primary); box-shadow: inset 0 0 0 1.5px var(--primary); }
  .card.sel .name { color: var(--primary); }
  .card.locked { cursor: default; }
  .name { font-size: 13px; font-weight: 500; word-break: break-all; padding-right: 18px;
          display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .meta { display: flex; align-items: center; gap: 6px; margin-top: 4px; font-size: 11.5px; color: var(--muted); }
  .tag { border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; line-height: 16px; }
  .delay { margin-left: auto; font-variant-numeric: tabular-nums; padding: 0 2px; border-radius: 4px; }
  .delay:hover { background: var(--primary-bg); color: var(--primary); }
  .delay.d-fast { color: var(--good); }
  .delay.d-mid { color: var(--warn); }
  .delay.d-slow, .delay.d-timeout { color: var(--bad); }
  .delay.d-none { opacity: .55; }
  .delay.plain:hover { background: none; color: inherit; }
  .delay.plain.d-fast:hover { color: var(--good); }
  .delay.plain.d-mid:hover { color: var(--warn); }
  .delay.plain.d-slow:hover, .delay.plain.d-timeout:hover { color: var(--bad); }

  /* 系统标记：星级（灰色底星上叠一层按比例截断的金色星，支持半星）+ 样本数 */
  .rate { display: flex; align-items: center; gap: 6px; margin-top: 3px; font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; }
  .stars { position: relative; display: inline-block; color: var(--star-off); font-size: 12.5px; letter-spacing: 1px; line-height: 1; }
  .stars i { position: absolute; left: 0; top: 0; overflow: hidden; color: var(--star); font-style: normal; }
  .rate .to { color: var(--bad); }

  /* 质量标记：右上角徽标 + 底色（不画边框，边框只留给选中） */
  .card.m-good { background-image: linear-gradient(var(--good-bg), var(--good-bg)); }
  .card.m-warn { background-image: linear-gradient(var(--warn-bg), var(--warn-bg)); }
  .card.m-bad  { background-image: linear-gradient(var(--bad-bg), var(--bad-bg)); }
  .card.m-bad .name { opacity: .8; }
  /* 已标记的卡片选中时只留标记底色，不再叠选中的蓝底 */
  .card.sel.m-good, .card.sel.m-warn, .card.sel.m-bad { background-color: var(--card); }
  .badge {
    position: absolute; top: 6px; right: 6px; width: 17px; height: 17px; border-radius: 50%;
    color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; line-height: 1;
  }
  .badge.good { background: var(--good); }
  .badge.warn { background: var(--warn); }
  .badge.bad  { background: var(--bad); }

  #menu {
    position: fixed; z-index: 100; display: none; min-width: 168px; padding: 4px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, .18);
  }
  #menu .mtitle { font-size: 12px; color: var(--muted); padding: 5px 9px 6px; border-bottom: 1px solid var(--line); margin-bottom: 3px;
                  max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #menu button {
    display: flex; width: 100%; align-items: center; gap: 8px; border: 0; background: none; color: var(--text);
    font: inherit; font-size: 13px; padding: 6px 9px; border-radius: 5px; cursor: pointer; text-align: left;
  }
  #menu button:hover { background: var(--card-hover); }
  #menu button:disabled { color: var(--muted); cursor: default; background: none; }
  #menu button.cur { font-weight: 600; }
  #menu button.cur::after { content: "当前"; margin-left: auto; font-size: 11px; color: var(--muted); font-weight: 400; }
  #menu .badge { position: static; }
  #menu .hint { font-size: 12.5px; color: var(--muted); padding: 6px 9px; }

  .removed { margin-top: 18px; font-size: 13px; color: var(--muted); }
  .removed summary { cursor: pointer; }
  .removed li { margin: 2px 0; }
  .empty { color: var(--muted); padding: 30px; text-align: center; }
  #toast {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 200;
    background: var(--text); color: var(--bg); padding: 7px 14px; border-radius: 6px; font-size: 13px;
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  #toast.show { opacity: .92; }
  @media (max-width: 640px) {
    header, main { padding-left: 16px; padding-right: 16px; }
    .tools { margin-left: 0; }
    input[type=search] { width: 140px; }
  }
</style>
</head>
<body>
<header>
  <h1>节点标记</h1>
  <span class="seg" id="modeSwitch">
    <button data-mode="user" title="右键节点卡片，手动标记好用 / 一般 / 不建议">用户标记</button>
    <button data-mode="system" title="按「测全组」的历史结果自动算推荐指数（星级）">系统标记</button>
  </span>
  <span id="profile" class="chip">连接中…</span>
  <span class="counts" id="counts"></span>
  <div class="tools">
    <input type="search" id="q" placeholder="搜索节点">
    <select id="sort" title="排序">
      <option value="default">默认顺序</option>
      <option value="cv">按cv</option>
      <option value="delay">按延迟</option>
      <option value="mark" class="user-only">按标记</option>
      <option value="markDelay" class="user-only">按标记+延迟</option>
      <option value="rating" class="system-only">按推荐指数</option>
      <option value="name">按名称</option>
    </select>
    <label class="toggle user-only"><input type="checkbox" id="hideBad">隐藏不建议</label>
    <label class="toggle user-only"><input type="checkbox" id="onlyMarked">只看已标记</label>
    <button class="btn user-only" id="clearAll" title="取消当前订阅下所有节点的标记">取消全部标记</button>
  </div>
</header>
<main id="main"><div class="empty">正在读取 Clash Verge…</div></main>
<div id="menu"></div>
<div id="toast"></div>

<script>
const MARK_INFO = {
  good: { label: '好用', icon: '✓' },
  warn: { label: '一般', icon: '!' },
  bad:  { label: '不建议', icon: '✕' },
};
const MARK_ORDER = { good: 0, warn: 1, null: 2, bad: 3 };
const SELECTABLE = new Set(['Selector', 'URLTest', 'Fallback']);
const POLL_MS = 3000;

let state = null;
let lastJson = '';
const testing = new Set();          // 正在测速的节点名 / 'group:组名'（测全组和各个「仅测」共用）
const TEST_CONCURRENCY = 8;         // 「仅测」时同时测几个节点
// 组标题上的「仅测」按钮，按显示顺序。pick 决定测哪些节点。
// 「未标记」只算能标记的节点：代理组、DIRECT 这类不算（测代理组会顺带测它当前选中的节点，可能是已标记的）
const SUBSET_TESTS = {
  testMarked: { button: '仅测 ✓ !', label: ' ✓ ! ', title: '只测本组里标为 ✓ 好用、! 一般 的节点',
    pick: (n) => ['good', 'warn'].includes(state.marks[n]) },
  testUnmarked: { button: '仅测未标记', label: '未标记', title: '只测本组里还没有标记的节点（不含代理组、DIRECT 等不能标记的项）',
    pick: (n) => state.nodes[n] && state.nodes[n].markable && !state.marks[n] },
  testBad: { button: '仅测 ✕', label: ' ✕ ', title: '只测本组里标为 ✕ 不建议 的节点，看看有没有变好',
    pick: (n) => state.marks[n] === 'bad' },
};

// 每个浏览器自己的界面偏好（展开的组、筛选），存不了也不影响使用
const prefs = (() => {
  try { return JSON.parse(localStorage.getItem('nodeMarksPrefs')) || {}; } catch { return {}; }
})();
let firstVisit = !prefs.open;     // 第一次打开时默认展开第一个组
prefs.open = prefs.open || {};
// 两种模式各记各的排序方式（旧版只有一个 sort，归给用户标记）
prefs.mode = prefs.mode === 'system' ? 'system' : 'user';
prefs.sortBy = prefs.sortBy || { user: prefs.sort || 'default', system: 'rating' };
delete prefs.sort;
function savePrefs() { try { localStorage.setItem('nodeMarksPrefs', JSON.stringify(prefs)); } catch {} }
const isSystem = () => prefs.mode === 'system';

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

async function api(path, body) {
  const r = await fetch(path, {
    method: body ? 'POST' : 'GET',
    headers: { 'X-Node-Marks': '1', ...(body ? { 'Content-Type': 'application/json' } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

let toastTimer;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

async function refresh(force) {
  try {
    const s = await api('/api/state');
    const json = JSON.stringify(s);
    if (!force && json === lastJson) return;
    lastJson = json; state = s;
    render();
  } catch (e) {
    $('profile').className = 'chip err';
    // fetch 直接失败说明本地服务没了（比如所有页面关掉后它自动退出了），而不是内核的问题
    $('profile').textContent = e instanceof TypeError ? '本地服务已停止，在终端重新运行 nodemark（或 node nodemark.js）' : e.message;
  }
}

function delayView(name, d) {
  if (testing.has(name)) return { cls: 'd-none', text: '测速中…' };
  if (d === null || d === undefined) return { cls: 'd-none', text: isSystem() ? '—' : '测速' };
  if (d === 0) return { cls: 'd-timeout', text: '超时' };
  return { cls: d < 400 ? 'd-fast' : d < 1000 ? 'd-mid' : 'd-slow', text: d + ' ms' };
}

// 和 Clash Verge 的「按延迟」一致：先分档（测出延迟 < 超时 < 失败 < 没测过），同档里只有测出延迟的按数值排。
// 内核历史里的 0（失败）在 Clash Verge 里算 1e6，归到「失败」档
const CV_SORT_LABEL = { 0: '默认顺序', 1: '按延迟', 2: '按名称' };
function cvDelayRank(n) {
  const d = state.nodes[n] && state.nodes[n].delay;
  if (d === null || d === undefined || d < 0) return [4, 0];
  if (d === 0 || d > 1e5) return [2, 0];
  if (d >= state.cvTimeout) return [1, 0];
  return [0, d];
}
function cvDelayCompare(a, b) {
  const [ra, da] = cvDelayRank(a), [rb, db] = cvDelayRank(b);
  return ra - rb || da - db;
}

// 按推荐指数：星级高的在前，同星级按未取整的分数、再按延迟；没评分的（含代理组、DIRECT）排最后
function ratingCompare(a, b, delayKey) {
  const ra = state.ratings[a], rb = state.ratings[b];
  if (!ra || !rb) return (!ra - !rb) || (!ra && !rb ? delayKey(a) - delayKey(b) : 0);
  return rb.stars - ra.stars || rb.score - ra.score || delayKey(a) - delayKey(b);
}

// 星级规则的简要说明，悬停在「系统标记」按钮和星级上时显示；细节见 nodemark.js 的 SCORE_BANDS、rateNode。
// 延迟区间用后台服务发来的当前档位表，后台服务是旧版本、没发档位表时不写区间
const SYSTEM_BTN_TITLE = document.querySelector('button[data-mode=system]').title;
function ratingRules() {
  const b = state && state.bands;
  const bandLines = b ? `　（当前统一延迟${state.unified ? '已开启' : '已关闭'}；开、关两套区间不同，每次结果按测试时的设置算）\n` +
    b.map(([max, score], i) => `　${i ? `${b[i - 1][0]}–${max} ms` : `${max} ms 以下`}：${score} 分`).join('\n') +
    `\n　${b[b.length - 1][0]} ms 及以上、超时、失败：0 分\n` : '';
  return '星级规则：\n' +
    '· 系统标记模式下每次「测全组」，给每个节点记一次结果，延迟越低分越高' + (b ? '：\n' + bandLines : '（5–1 分），超时、失败 0 分\n') +
    '· 推荐指数是最近 30 次结果的加权平均，越差的结果权重越大；新节点先垫一次 3 分，测一次拿不到满分\n' +
    '· 有超时就封顶：1 次最多 2 星，2 次以上或占 15% 以上最多 1 星，占 40% 以上 0 星\n' +
    '· 一轮里组内 60% 以上节点都超时，当作本机网络问题，这一轮不计入';
}

// 系统标记的星级行：星级 + 样本数，有超时写出次数；详情放在悬停提示里
function rateView(n, node) {
  if (!node.markable) return '';
  const r = state.ratings[n];
  if (!r) return `<div class="rate" title="${esc('还没测过全组\n\n' + ratingRules())}">未评分</div>`;
  const tip = `推荐指数 ${r.score.toFixed(2)} → ${r.stars} 星` +
    `\n最近 ${r.n} 次测全组，超时 ${r.timeouts} 次（慢于 ${state.slowMs} ms 也算超时）` +
    (r.capped ? '\n因超时封顶' : '') + (r.n < 3 ? '\n样本不足 3 个，仅供参考' : '') + '\n\n' + ratingRules();
  return `<div class="rate" title="${esc(tip)}">` +
    `<span class="stars">★★★★★<i style="width:${r.stars * 20}%">★★★★★</i></span>` +
    `<span>${r.stars} · ${r.n} 次${r.n < 3 ? ' · 样本不足' : ''}</span>` +
    (r.timeouts ? `<span class="to">超时 ${r.timeouts} 次</span>` : '') + '</div>';
}

function sortedMembers(g) {
  const q = $('q').value.trim().toLowerCase();
  // 筛选开关只属于用户标记模式
  const hideBad = !isSystem() && $('hideBad').checked, onlyMarked = !isSystem() && $('onlyMarked').checked;
  let list = g.all.filter((n) => {
    const m = state.marks[n] || null;
    if (q && !n.toLowerCase().includes(q)) return false;
    if (hideBad && m === 'bad') return false;
    if (onlyMarked && !m) return false;
    return true;
  });
  const sort = $('sort').value;
  const markKey = (n) => MARK_ORDER[state.marks[n] || null];
  const delayKey = (n) => { const d = state.nodes[n] && state.nodes[n].delay; return d ? d : d === 0 ? 1e9 : 1e9 + 1; };
  if (sort === 'cv') {
    const t = state.cvSort && state.cvSort[g.name];
    if (t === 1) list = [...list].sort((a, b) => cvDelayCompare(a, b));
    else if (t === 2) list = [...list].sort((a, b) => a.localeCompare(b));
  }
  else if (sort === 'delay') list = [...list].sort((a, b) => delayKey(a) - delayKey(b));
  else if (sort === 'name') list = [...list].sort((a, b) => a.localeCompare(b, 'zh'));
  else if (sort === 'mark') list = [...list].sort((a, b) => markKey(a) - markKey(b));
  else if (sort === 'markDelay') list = [...list].sort((a, b) => markKey(a) - markKey(b) || delayKey(a) - delayKey(b));
  else if (sort === 'rating') list = [...list].sort((a, b) => ratingCompare(a, b, delayKey));
  return list;
}

// 组内节点分几栏：宽屏 3 栏，窄一些 2 栏，手机 1 栏
const colCount = () => (innerWidth >= 1200 ? 3 : innerWidth >= 760 ? 2 : 1);
let lastCols = colCount();
window.addEventListener('resize', () => { if (colCount() !== lastCols) { lastCols = colCount(); if (state) render(); } });

function render() {
  const s = state;
  $('profile').className = 'chip';
  $('profile').textContent = `${s.demo ? '演示数据　·　' : ''}订阅：${s.profile.name}　·　${{ rule: '规则', global: '全局', direct: '直连' }[s.mode] || s.mode}模式`;

  const system = isSystem();
  document.querySelector('button[data-mode=system]').title = SYSTEM_BTN_TITLE + '\n\n' + ratingRules();
  if (!s.ratings) s.ratings = {};   // 后台服务是旧版本时没有这个字段
  const total = `共 ${s.realCount} 个节点${s.syncing ? '（清单同步中）' : ''}`;
  if (system) {
    const rs = Object.values(s.ratings);
    $('counts').innerHTML =
      `<span style="color:var(--good)">4★ 以上 <b>${rs.filter((r) => r.stars >= 4).length}</b></span>` +
      `<span style="color:var(--warn)">2–3.5★ <b>${rs.filter((r) => r.stars >= 2 && r.stars < 4).length}</b></span>` +
      `<span style="color:var(--bad)">1.5★ 以下 <b>${rs.filter((r) => r.stars < 2).length}</b></span>` +
      `<span>已评分 ${rs.length} · ${total}</span>` +
      (s.slowMs ? `<span title="当前统一延迟设置下的门槛">慢于 ${s.slowMs} ms 算超时</span>` : '');
  } else {
    const c = { good: 0, warn: 0, bad: 0 };
    for (const m of Object.values(s.marks)) c[m]++;
    $('counts').innerHTML =
      `<span style="color:var(--good)">✓ <b>${c.good}</b></span>` +
      `<span style="color:var(--warn)">! <b>${c.warn}</b></span>` +
      `<span style="color:var(--bad)">✕ <b>${c.bad}</b></span><span>${total}</span>`;
  }
  $('clearAll').disabled = !Object.keys(s.marks).length;

  if (!s.groups.length) {
    $('main').innerHTML = `<div class="empty">${s.mode === 'direct' ? '当前是直连模式，没有代理组。' : '没有可显示的代理组。'}</div>`;
    return;
  }

  if (firstVisit) { prefs.open[s.groups[0].name] = true; firstVisit = false; savePrefs(); }

  const cvMode = $('sort').value === 'cv';
  const nCols = colCount();
  let html = '';
  for (const g of s.groups) {
    const open = !!prefs.open[g.name];
    // cvSort 字段不存在说明后台服务还是更新前启动的旧版本（页面每次刷新都重新读，服务要重启才会更新）
    const cvNote = !cvMode ? '' : s.cvSort ? ` · CV：${CV_SORT_LABEL[s.cvSort[g.name] || 0]}`
      : s.cvSort === undefined ? ' · 后台服务是旧版本，重启服务后才能按cv排序' : ' · 读不到 CV 的排序，按默认顺序';
    const members = sortedMembers(g);
    const gm = { good: 0, warn: 0, bad: 0 };
    for (const n of g.all) if (s.marks[n]) gm[s.marks[n]]++;
    const gTesting = testing.has('group:' + g.name);
    html += `<section class="group${open ? ' open' : ''}" data-group="${esc(g.name)}">
      <div class="ghead" data-act="toggle">
        <span class="chev">▶</span>
        <div class="gtitle">
          <div class="gname">${esc(g.name)}</div>
          <div class="gsub">${esc(g.type)} · ${esc(g.now || '—')}${g.fixed ? '（已固定）' : ''}${cvNote}</div>
        </div>
        <span class="gmarks">${g.all.length} 个 · ${system ? `已评分 ${g.all.filter((n) => s.ratings[n]).length}`
          : `<span style="color:var(--good)">✓${gm.good}</span> <span style="color:var(--warn)">!${gm.warn}</span> <span style="color:var(--bad)">✕${gm.bad}</span>`}</span>
        <span class="gbtns">
          ${system ? '' : Object.entries(SUBSET_TESTS).map(([act, t]) =>
            `<button data-act="${act}" title="${t.title}"${gTesting || !g.all.some(t.pick) ? ' disabled' : ''}>${t.button}</button>`).join('')}
          <button data-act="testGroup"${system ? ' title="测本组所有节点，结果记入推荐指数的历史"' : ''}${gTesting ? ' disabled' : ''}>${gTesting ? '测速中…' : '测全组'}</button>
        </span>
      </div>
      <div class="grid">`;
    if (open && members.length) {
      // 每栏 rows 行 × 2 个，按顺序先填满第一栏
      const perCol = 2 * Math.ceil(members.length / (2 * nCols));
      members.forEach((n, i) => {
        if (i % perCol === 0) html += `${i ? '</div>' : ''}<div class="ncol">`;
        const node = s.nodes[n] || { type: '?' };
        const m = system ? '' : s.marks[n] || '';   // 系统标记模式不显示手动标记
        const sel = g.now === n;
        const dv = delayView(n, node.delay);   // 系统标记只能测全组，延迟不能点
        const locked = !SELECTABLE.has(g.type);
        html += `<div class="card${sel ? ' sel' : ''}${m ? ' m-' + m : ''}${locked ? ' locked' : ''}" data-node="${esc(n)}" title="${esc(n)}">
          ${m ? `<span class="badge ${m}">${MARK_INFO[m].icon}</span>` : ''}
          <div class="name">${esc(n)}</div>
          ${system ? rateView(n, node) : ''}
          <div class="meta">
            <span class="tag">${esc(node.isGroup ? '组·' + node.type : node.type)}</span>
            ${node.udp && !node.isGroup ? '<span class="tag">UDP</span>' : ''}
            <span class="delay${system ? ' plain' : ''} ${dv.cls}"${system ? '' : ' data-act="testNode"'}>${dv.text}</span>
          </div>
        </div>`;
      });
      html += '</div>';
    } else if (open) {
      html += `<div class="empty" style="flex:1;padding:12px">没有符合筛选条件的节点</div>`;
    }
    html += `</div></section>`;
  }

  if (!system && s.removedRecent.length) {
    html += `<details class="removed"><summary>最近因节点消失而移除的标记（${s.removedRecent.length}）</summary><ul>` +
      s.removedRecent.map((r) => `<li><span class="badge ${r.mark}" style="position:static;display:inline-grid;vertical-align:-3px">${MARK_INFO[r.mark].icon}</span> ${esc(r.name)} <span style="opacity:.7">· ${new Date(r.removedAt).toLocaleString()}</span></li>`).join('') +
      `</ul></details>`;
  }
  $('main').innerHTML = html;
}

// ---------- 交互 ----------

$('main').addEventListener('click', async (e) => {
  const groupEl = e.target.closest('.group');
  if (!groupEl) return;
  const group = groupEl.dataset.group;
  const act = e.target.closest('[data-act]');
  const card = e.target.closest('.card');

  if (act && act.dataset.act === 'testGroup') {
    e.stopPropagation();
    testing.add('group:' + group);
    const g = state.groups.find((x) => x.name === group);
    g.all.forEach((n) => testing.add(n));
    render();
    // 只有系统标记模式下的测全组记入推荐指数的历史
    const record = isSystem();
    try {
      const r = await api('/api/delay', { group, record });
      if (record) {
        toast(r.recorded === undefined ? '后台服务是旧版本：运行 node nodemark.js stop 后重新启动'
          : !r.total ? `${group}：没有可评分的节点`
          : r.recorded ? `${group}：${r.total} 个节点已记入历史${r.timeouts ? `，${r.timeouts} 个超时` : ''}`
          : `${group}：本轮 ${r.timeouts}/${r.total} 个超时，疑似本机网络问题，不计入`);
      }
    } catch (err) { toast(err.message); }
    testing.delete('group:' + group); g.all.forEach((n) => testing.delete(n));
    return refresh(true);
  }
  if (act && SUBSET_TESTS[act.dataset.act]) {
    e.stopPropagation();
    const g = state.groups.find((x) => x.name === group);
    const t = SUBSET_TESTS[act.dataset.act];
    const names = g.all.filter(t.pick);
    if (!names.length) return;
    testing.add('group:' + group);
    names.forEach((n) => testing.add(n));
    render();
    // 逐个调单节点测速，几个一起测；每测完一个就先把结果显示出来，最后再整体刷新
    let failed = 0;
    const queue = [...names];
    const worker = async () => {
      for (let n; (n = queue.shift()) !== undefined;) {
        try {
          const r = await api('/api/delay', { name: n });
          if (!r.ok) failed++;
          if (state.nodes[n]) state.nodes[n].delay = r.ok ? r.delay : 0;
        } catch (err) { failed++; }
        testing.delete(n); render();
      }
    };
    await Promise.all(Array.from({ length: Math.min(TEST_CONCURRENCY, names.length) }, worker));
    testing.delete('group:' + group);
    toast(`${group}：测了 ${names.length} 个${t.label}节点${failed ? `，${failed} 个超时或失败` : ''}`);
    return refresh(true);
  }
  if (act && act.dataset.act === 'toggle') {
    prefs.open[group] = !prefs.open[group]; savePrefs(); return render();
  }
  if (act && act.dataset.act === 'testNode' && card) {
    const name = card.dataset.node;
    testing.add(name); render();
    try {
      const r = await api('/api/delay', { name });
      if (!r.ok) toast(`${name}：${r.message || '超时'}`);
    } catch (err) { toast(err.message); }
    testing.delete(name);
    return refresh(true);
  }
  if (card) {
    const g = state.groups.find((x) => x.name === group);
    const name = card.dataset.node;
    if (!SELECTABLE.has(g.type) || g.now === name) return;
    try {
      await api('/api/select', { group, name });
      g.now = name; render();
      toast(`${group} → ${name}`);
    } catch (err) { toast(err.message); }
    refresh(true);
  }
});

const menu = $('menu');
let menuTarget = null;

$('main').addEventListener('contextmenu', (e) => {
  const card = e.target.closest('.card');
  if (!card || isSystem()) return;   // 系统标记模式不能手动标记，留浏览器自己的右键菜单
  e.preventDefault();
  const name = card.dataset.node;
  const node = state.nodes[name] || {};
  menuTarget = name;
  const cur = state.marks[name] || null;
  if (node.markable) {
    menu.innerHTML = `<div class="mtitle">${esc(name)}</div>` +
      Object.entries(MARK_INFO).map(([k, v]) =>
        `<button data-mark="${k}" class="${cur === k ? 'cur' : ''}"><span class="badge ${k}">${v.icon}</span>${v.label}</button>`).join('') +
      `<button data-mark=""${cur ? '' : ' disabled'}><span class="badge" style="background:var(--muted)">–</span>取消标记</button>`;
  } else {
    menu.innerHTML = `<div class="mtitle">${esc(name)}</div><div class="hint">${node.isGroup ? '这是代理组，不能标记' : '内置出站，不能标记'}</div>`;
  }
  menu.style.display = 'block';
  const { innerWidth: W, innerHeight: H } = window;
  const r = menu.getBoundingClientRect();
  menu.style.left = Math.min(e.clientX, W - r.width - 8) + 'px';
  menu.style.top = Math.min(e.clientY, H - r.height - 8) + 'px';
});

menu.addEventListener('click', async (e) => {
  const b = e.target.closest('button[data-mark]');
  if (!b) return;
  const mark = b.dataset.mark || null;
  hideMenu();
  if (mark) state.marks[menuTarget] = mark; else delete state.marks[menuTarget];
  render();
  try { await api('/api/mark', { name: menuTarget, mark }); }
  catch (err) { toast('保存失败：' + err.message); }
  refresh(true);
});

$('clearAll').addEventListener('click', async () => {
  const n = Object.keys(state.marks).length;
  if (!n || !confirm(`取消订阅「${state.profile.name}」下全部 ${n} 个节点的标记？取消后不能恢复。`)) return;
  const old = state.marks;
  state.marks = {}; render();
  try {
    const r = await api('/api/clear-marks', {});
    toast(`已取消 ${r.cleared} 个标记`);
  } catch (err) {
    state.marks = old; render();
    // 页面每次刷新都是新的，后台服务要重启才有这个接口
    toast(err.message === 'not found' ? '后台服务是旧版本：运行 node nodemark.js stop 后重新启动' : '取消失败：' + err.message);
  }
  refresh(true);
});

function hideMenu() { menu.style.display = 'none'; }
document.addEventListener('click', (e) => { if (!menu.contains(e.target)) hideMenu(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') hideMenu(); });
window.addEventListener('scroll', hideMenu, true);
window.addEventListener('blur', hideMenu);

// 切换模式：按模式显示控件，排序换成这个模式上次用的（另一个模式专属的排序不可用时退回默认顺序）
function applyMode() {
  document.body.dataset.mode = prefs.mode;
  for (const b of $('modeSwitch').children) b.classList.toggle('on', b.dataset.mode === prefs.mode);
  const sort = $('sort');
  sort.value = prefs.sortBy[prefs.mode];
  const opt = sort.selectedOptions[0];
  if (!opt || opt.classList.contains(isSystem() ? 'user-only' : 'system-only')) sort.value = 'default';
}
applyMode();
$('modeSwitch').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-mode]');
  if (!b || b.dataset.mode === prefs.mode) return;
  prefs.mode = b.dataset.mode; savePrefs();
  hideMenu(); applyMode();
  if (state) render();
});
$('sort').addEventListener('change', () => {
  prefs.sortBy[prefs.mode] = $('sort').value; savePrefs();
  if (state) render();
});

for (const id of ['q', 'hideBad', 'onlyMarked']) {
  const el = $(id);
  if (id !== 'q' && prefs[id] !== undefined) el[el.type === 'checkbox' ? 'checked' : 'value'] = prefs[id];
  el.addEventListener(id === 'q' ? 'input' : 'change', () => {
    if (id !== 'q') { prefs[id] = el.type === 'checkbox' ? el.checked : el.value; savePrefs(); }
    if (state) render();
  });
}

// 和服务保持一条长连接：所有页面都关掉后，后台服务据此自动退出。断了浏览器会自己重连
try { new EventSource('/api/alive'); } catch {}

refresh(true);
setInterval(() => { if (menu.style.display !== 'block' && !document.hidden) refresh(); }, POLL_MS);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
</script>
</body>
</html>
